name: Apply audited secure-password fix

on:
  push:
    branches: [fix/audit-secure-password-input]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-secure-password-input

      - name: Replace plaintext password conversion
        shell: pwsh
        run: |
          $Path = 'WindowsTroubleshooter.ps1'
          $Content = Get-Content -LiteralPath $Path -Raw

          $OldReset = 'elseif ($c -eq "2") { Set-LocalUser -Name (Read-Host "   Username") -Password (ConvertTo-SecureString (Read-Host "   New Password") -AsPlainText -Force); Wait-Key }'
          $NewReset = 'elseif ($c -eq "2") { Set-LocalUser -Name (Read-Host "   Username") -Password (Read-Host "   New Password" -AsSecureString); Wait-Key }'
          $OldPrompt = '$p = Read-Host "   Enter Plaintext Password"'
          $NewPrompt = '$p = Read-Host "   Enter Password" -AsSecureString'
          $OldCreate = 'New-LocalUser -Name $u -Password (ConvertTo-SecureString $p -AsPlainText -Force) -Description "Emergency Support Admin"'
          $NewCreate = 'New-LocalUser -Name $u -Password $p -Description "Emergency Support Admin"'

          foreach ($Replacement in @(
              @{ Old = $OldReset; New = $NewReset },
              @{ Old = $OldPrompt; New = $NewPrompt },
              @{ Old = $OldCreate; New = $NewCreate }
          )) {
              if (-not $Content.Contains($Replacement.Old)) {
                  throw "Expected source fragment was not found: $($Replacement.Old)"
              }
              $Content = $Content.Replace($Replacement.Old, $Replacement.New)
          }

          Set-Content -LiteralPath $Path -Value $Content -Encoding UTF8

          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $Path),
              [ref]$Tokens,
              [ref]$Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Error $_.Message }
              throw 'PowerShell parser validation failed.'
          }

          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $Findings = @(Invoke-ScriptAnalyzer -Path $Path -Severity Error)
          if ($Findings.Count -gt 0) {
              $Findings | Format-Table -AutoSize | Out-String | Write-Host
              throw 'PSScriptAnalyzer reported errors.'
          }

      - name: Commit validated fix
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WindowsTroubleshooter.ps1
          git rm .github/workflows/audit-password-fix.yml
          git commit -m "fix: read local-account passwords as SecureString"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
